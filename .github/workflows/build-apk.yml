name: Crear APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "ElBuenSaborAndroid.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Descomprimir proyecto
        run: |
          mkdir source
          unzip ElBuenSaborAndroid.zip -d source

      - name: Instalar herramientas Android
        run: dotnet workload install maui-android

      - name: Compilar APK
        run: |
          dotnet publish source/ElBuenSaborAndroid/ElBuenSaborAndroid.csproj \
            -f net8.0-android -c Debug \
            -p:AndroidPackageFormat=apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Buen-Sabor-APK
          path: source/ElBuenSaborAndroid/bin/Debug/net8.0-android/**/*.apk
          if-no-files-found: error
          
